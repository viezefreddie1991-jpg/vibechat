<!DOCTYPE html>
<html>
<head>
    <title>Discord 2.0</title>
    <link rel="stylesheet" href="style.css">
    <script>
       /* // This runs instantly before the body is even drawn
        const savedName = localStorage.getItem('vibe-name');

        // We use a listener to wait just until the element exists
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('overlay');
            if (!savedName) {
                overlay.style.display = 'flex'; // Only show if name is missing
            }
        });*/
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/socket.io/socket.io.js"></script>

</head>
<body>


<div id="overlay">
    <div class="modal">
        <h2 id="auth-title">Welcome Back</h2>

        <input id="display-name-input" type="text" placeholder="Display Name" style="display: none;" />
        <input id="email-input" type="email" placeholder="Email"/>
        <input id="pass-input" type="password" placeholder="Password"/>

        <p id="error-msg" style="min-height: 1.2rem; font-size: 0.8rem; margin-bottom: 10px;"></p>
        <button id="auth-btn">Login</button>
        <p id="toggle-text">Need an account? <span id="switch-mode" style="color:#00d4ff; cursor:pointer">Sign Up</span>
        </p>
    </div>
</div>


<div id="app-container">
    <aside id="sidebar">
        <h3>Channels</h3>
        <button class="channel-btn active" onclick="switchRoom('general')"># general</button>
        <button class="channel-btn" onclick="switchRoom('gaming')"># gaming</button>
        <button class="channel-btn" onclick="switchRoom('code-talk')"># code-talk</button>

        <div id="room-members">
            <h3 id="current-room-title">In #general</h3>
            <ul id="user-list">
            </ul>
        </div>
    </aside>

    <main id="chat-main">
        <ul id="messages"></ul>
        <div id="typing-indicator" style="padding: 5px 20px; font-size: 0.8rem; color: #888; height: 20px;"></div>
        <form id="form">
            <input id="input" autocomplete="off" placeholder="Type a message..."/>
            <button>Send</button>
        </form>
    </main>
</div>


<script>




    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const typingIndicator = document.getElementById('typing-indicator');
    let typingTimeout;

    const overlay = document.getElementById('overlay');
    const nameInput = document.getElementById('name-input');

    const emailInput = document.getElementById('email-input');
    const passInput = document.getElementById('pass-input');
    const authBtn = document.getElementById('auth-btn'); // Renamed from join-btn
    let currentRoom = 'general';

    // Rename the variable to 'db' or 'supabaseClient'
    const supabaseUrl = 'https://knldcjijbpvxhcwenzle.supabase.co';
    const supabaseKey = 'sb_publishable_CU5pG98gM8IhgmVFeJRmAQ_uq4P1Xv9';


    // Use a different name than the library itself
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    // Now use 'db' whenever you need to login or signup
    async function handleAuth() {
        const {data, error} = await db.auth.signInWithPassword({
            email: emailInput.value,
            password: passInput.value
        });
    }

    // AT THE TOP OF YOUR SCRIPT
    async function checkUser() {
        const { data: { user } } = await db.auth.getUser();

        if (user) {
            // We get the name from Supabase, NOT localStorage
            const name = user.user_metadata.display_name || user.email.split('@')[0];
            overlay.style.display = 'none';
            joinChat(name);
        } else {
            // Show the login modal
            overlay.style.display = 'flex';
        }
    }

    checkUser();



    let isSignUpMode = false;
    const switchLink = document.getElementById('switch-mode');
    const authTitle = document.getElementById('auth-title');

    // Toggle between Login and Signup
    switchLink.addEventListener('click', () => {
        isSignUpMode = !isSignUpMode;
        // Show/Hide the Display Name field
        document.getElementById('display-name-input').style.display = isSignUpMode ? 'block' : 'none';

        authBtn.innerText = isSignUpMode ? "Create Account" : "Login";
        authTitle.innerText = isSignUpMode ? "Join the Vibe" : "Welcome Back";
        switchLink.innerText = isSignUpMode ? "Login instead" : "Sign Up";
    });

    authBtn.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passInput.value.trim();
        const errorDisplay = document.getElementById('error-msg'); // The <p> we added

        // Reset UI
        errorDisplay.innerText = "";
        authBtn.disabled = true;
        authBtn.innerText = "Processing...";

        try {
            if (isSignUpMode) {

                const displayName = document.getElementById('display-name-input').value.trim();
                if (!displayName) throw new Error("Please choose a Display Name");

                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            display_name: displayName // This saves it to the user's profile
                        }
                    }
                });
                if (error) throw error;

                // If signup works, show a success message instead of a scary alert
                errorDisplay.style.color = "#00d4ff";
                errorDisplay.innerText = "Account created! Check your email.";
            } else {
                const {data, error} = await db.auth.signInWithPassword({email, password});
                if (error) throw error;

                const userVibeName = data.user.user_metadata.display_name || data.user.email.split('@')[0];
                //localStorage.setItem('vibe-name', userVibeName);
                overlay.style.display = 'none';
                joinChat(userVibeName);
            }
        } catch (err) {
            // Handle specific error codes for a better "vibe"
            console.log("Supabase Error Object:", err); // Keep this for debugging

            if (err.status === 400) {
                errorDisplay.innerText = "Wrong email or password. Try again!";
            } else if (err.status === 422) {
                const msg = err.message.toLowerCase();

                if (msg.includes("password")) {
                    errorDisplay.innerText = "Password is too short (min 6 characters).";
                } else if (msg.includes("already registered") || msg.includes("exists")) {
                    errorDisplay.innerText = "This email is already taken! Try logging in.";
                } else if (msg.includes("not allowed") || msg.includes("signups")) {
                    errorDisplay.innerText = "Signups are disabled.";
                } else {
                    errorDisplay.innerText = "Invalid data. Please check your inputs.";
                }
            } else {
                errorDisplay.innerText = err.message;
            }

            errorDisplay.style.color = "#ff4b4b"; // Error Red
        } finally {
            authBtn.disabled = false;
            authBtn.innerText = isSignUpMode ? "Create Account" : "Login";
        }
    });


    function switchRoom(newRoom) {
        // 1. If we are already there, do nothing
        if (newRoom === currentRoom) return;

        // 2. Update the Title UI (using the new name)
        document.getElementById('current-room-title').innerText = `In #${newRoom}`;

        // 3. Visual active state for buttons
        document.querySelectorAll('.channel-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(newRoom));
        });

        // 4. Clear the UI immediately
        messages.innerHTML = '';

        // 5. Tell the server to move us (passing the current and the new room)
        socket.emit('switch-room', { oldRoom: currentRoom, newRoom: newRoom });

        // 6. Finally, update our local variable to the new room
        currentRoom = newRoom;
    }

    // Function to handle the join logic consistently
    function joinChat(name) {
        document.getElementById('app-container').style.visibility = 'visible';
        socket.emit('set-identity', name);
        // Manually trigger the room join for the default room
        socket.emit('switch-room', {oldRoom: null, newRoom: 'general'});
    }

    // Function to add a message to the UI
    function addMessageToUI(data) {
        const item = document.createElement('li');
        item.classList.add('message-item');
        item.innerHTML = `
      <span class="vibe-id" style="color: ${data.color}">${data.userName}</span>
      <span class="text">${data.text}</span>
    `;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    }


    /*// Check for returning user
    if (savedName) {
        joinChat(savedName);
    }*/

    // Handle the list update
    socket.on('update-user-list', ({ room, users }) => {
        // Only update if it's the room we are actually looking at
        if (room === currentRoom) {
            const userListUl = document.getElementById('user-list');
            userListUl.innerHTML = '';
            users.forEach(username => {
                const li = document.createElement('li');
                li.className = 'user-item';
                li.innerHTML = `<span class="status-dot"></span> ${username}`;
                userListUl.appendChild(li);
            });
        }
    });

    // This remains the same as before, but now it fires every time you switch rooms
    socket.on('load history', (history) => {
        messages.innerHTML = ''; // Double-check it's clear
        history.forEach(data => addMessageToUI(data));
    });

    // 2. Listen for others typing
    socket.on('user typing', (data) => {
        typingIndicator.textContent = `User_${data.id} is vibing...`;
    });

    socket.on('user stop typing', () => {
        typingIndicator.textContent = '';
    });

    socket.on('chat message', (data) => {
        typingIndicator.textContent = '';
        addMessageToUI(data);
    });


    // 1. Tell the server we are typing
    input.addEventListener('keypress', () => {
        socket.emit('typing');

        // Optional: Stop showing "typing" after 2 seconds of inactivity
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('stop typing');
        }, 2000);
    });


    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.emit('chat message', input.value);
            input.value = '';
        }
    });


</script>
</body>
</html>
