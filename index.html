<!DOCTYPE html>
<html>
<head>
    <title>Electron VibeChat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        #messages li { background: #333; margin-bottom: 10px; padding: 10px; border-radius: 8px; width: fit-content; max-width: 80%; }
        #form { display: flex; padding: 15px; background: #1e1e1e; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border: none; border-radius: 4px; background: #2a2a2a; color: white; outline: none; }
        button { padding: 10px 20px; background: #6200ee; color: white; border: none; border-radius: 4px; margin-left: 10px; cursor: pointer; }
    </style>

    <script>
        // This runs instantly before the body is even drawn
        const savedName = localStorage.getItem('vibe-name');

        // We use a listener to wait just until the element exists
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('overlay');
            if (!savedName) {
                overlay.style.display = 'flex'; // Only show if name is missing
            }
        });
    </script>
</head>
<body>
<div id="overlay" style="display:none;">
    <div class="modal">
        <h2>What's your vibe name?</h2>
        <input id="name-input" placeholder="Enter nickname..." />
        <button id="join-btn">Join Chat</button>
    </div>
</div>





<div id="app-container">
    <aside id="sidebar">
        <h3>Channels</h3>
        <button class="channel-btn active" onclick="switchRoom('general')"># general</button>
        <button class="channel-btn" onclick="switchRoom('gaming')"># gaming</button>
        <button class="channel-btn" onclick="switchRoom('code-talk')"># code-talk</button>
    </aside>

    <main id="chat-main">
        <ul id="messages"></ul>
        <div id="typing-indicator" style="padding: 5px 20px; font-size: 0.8rem; color: #888; height: 20px;"></div>
        <form id="form">
            <input id="input" autocomplete="off" placeholder="Type a message..." />
            <button>Send</button>
        </form>
    </main>
</div>




<script src="/socket.io/socket.io.js"></script>
<style>
    /* ... existing styles ... */
    .message-item {
        background: #333;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 8px;
        width: fit-content;
        max-width: 80%;
        display: flex;
        flex-direction: column;
    }
    .vibe-id {
        font-size: 0.7rem;
        font-weight: bold;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #121212;
        display: none; /* Change from 'flex' to 'none' */
        align-items: center; justify-content: center;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.3s ease; /* Adds a nice fade vibe */
    }
    .modal { background: #1e1e1e; padding: 30px; border-radius: 12px; text-align: center; }


    #overlay.visible {
        display: flex;
        opacity: 1;
    }


    /* Container for Sidebar + Chat */
    #app-container {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    /* Sidebar Styling */
    #sidebar {
        width: 200px;
        background: #181818;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        padding: 15px;
    }

    #sidebar h3 { font-size: 0.9rem; color: #888; margin-bottom: 20px; text-transform: uppercase; }

    .channel-btn {
        background: transparent; border: none; color: #ccc;
        text-align: left; padding: 10px; cursor: pointer;
        border-radius: 5px; margin-bottom: 5px; transition: 0.2s;
    }

    .channel-btn:hover { background: #252525; color: white; }
    .channel-btn.active { background: #333; color: #00d4ff; font-weight: bold; }

    /* Main Chat Area */
    #chat-main {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        position: relative;
    }

</style>

<script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const typingIndicator = document.getElementById('typing-indicator');
    let typingTimeout;

    const overlay = document.getElementById('overlay');
    const nameInput = document.getElementById('name-input');
    const joinBtn = document.getElementById('join-btn');
    let currentRoom = 'general';




    function switchRoom(newRoom) {
        if (newRoom === currentRoom) return;

        // Visual active state for buttons
        document.querySelectorAll('.channel-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(newRoom));
        });

        // 1. Clear the UI immediately so it feels snappy
        messages.innerHTML = '';

        // 2. Tell the server to move us and send new history
        socket.emit('switch-room', { oldRoom: currentRoom, newRoom: newRoom });
        currentRoom = newRoom;
    }

    // This remains the same as before, but now it fires every time you switch
    socket.on('load history', (history) => {
        messages.innerHTML = ''; // Double-check it's clear
        history.forEach(data => addMessageToUI(data));
    });


    // Function to handle the join logic consistently
    function joinChat(name) {
        socket.emit('set-identity', name);
        // Manually trigger the room join for the default room
        socket.emit('switch-room', { oldRoom: null, newRoom: 'general' });
    }

    // Check for returning user
    const savedName = localStorage.getItem('vibe-name');
    if (savedName) {
        joinChat(savedName);
    }

    // 2. If they just typed it in the modal
    joinBtn.addEventListener('click', () => {
        const inputName = nameInput.value.trim();
        if (inputName) {
            localStorage.setItem('vibe-name', inputName);
            overlay.style.display = 'none';
            joinChat(inputName);
        }
    });

   /* // Always emit the identity if it exists on load
    if (localStorage.getItem('vibe-name')) {
        socket.emit('set-identity', localStorage.getItem('vibe-name'));
    }*/

    // Function to add a message to the UI
    function addMessageToUI(data) {
        const item = document.createElement('li');
        item.classList.add('message-item');
        item.innerHTML = `
      <span class="vibe-id" style="color: ${data.color}">${data.userName}</span>
      <span class="text">${data.text}</span>
    `;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    }

    // 1. Tell the server we are typing
    input.addEventListener('keypress', () => {
        socket.emit('typing');

        // Optional: Stop showing "typing" after 2 seconds of inactivity
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('stop typing');
        }, 2000);
    });

    /*// Handle the history dump
    socket.on('load history', (history) => {
        // Clear current view (optional) and load all old messages
        messages.innerHTML = '';
        history.forEach(data => addMessageToUI(data));
    });*/

    // 2. Listen for others typing
    socket.on('user typing', (data) => {
        typingIndicator.textContent = `User_${data.id} is vibing...`;
    });

    socket.on('user stop typing', () => {
        typingIndicator.textContent = '';
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.emit('chat message', input.value);
            input.value = '';
        }
    });

    // Now handling the 'data' object { text, color, id }
    // Handle new incoming messages
    socket.on('chat message', (data) => {
        typingIndicator.textContent = '';
        addMessageToUI(data);
    });
</script>
</body>
</html>
