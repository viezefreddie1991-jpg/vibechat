<!DOCTYPE html>
<html>
<head>
    <title>Electron VibeChat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        #messages li { background: #333; margin-bottom: 10px; padding: 10px; border-radius: 8px; width: fit-content; max-width: 80%; }
        #form { display: flex; padding: 15px; background: #1e1e1e; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border: none; border-radius: 4px; background: #2a2a2a; color: white; outline: none; }
        button { padding: 10px 20px; background: #6200ee; color: white; border: none; border-radius: 4px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
<ul id="messages"></ul>
<div id="typing-indicator" style="padding: 5px 20px; font-size: 0.8rem; color: #888; height: 20px;"></div>
<form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button>Send</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<style>
    /* ... existing styles ... */
    .message-item {
        background: #333;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 8px;
        width: fit-content;
        max-width: 80%;
        display: flex;
        flex-direction: column;
    }
    .vibe-id {
        font-size: 0.7rem;
        font-weight: bold;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>

<script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const typingIndicator = document.getElementById('typing-indicator');
    let typingTimeout;

    // 1. Tell the server we are typing
    input.addEventListener('keypress', () => {
        socket.emit('typing');

        // Optional: Stop showing "typing" after 2 seconds of inactivity
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('stop typing');
        }, 2000);
    });

    // 2. Listen for others typing
    socket.on('user typing', (data) => {
        typingIndicator.textContent = `User_${data.id} is vibing...`;
    });

    socket.on('user stop typing', () => {
        typingIndicator.textContent = '';
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
            socket.emit('chat message', input.value);
            input.value = '';
        }
    });

    // Now handling the 'data' object { text, color, id }
    socket.on('chat message', (data) => {
        const item = document.createElement('li');
        item.classList.add('message-item');
        typingIndicator.textContent = '';
        // Create the ID label with the user's random color
        item.innerHTML = `
      <span class="vibe-id" style="color: ${data.color}">User_${data.id}</span>
      <span class="text">${data.text}</span>
    `;

        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    });
</script>
</body>
</html>
